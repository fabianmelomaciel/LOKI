name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Gitleaks (dogfooding — Loki no puede fallar su propio T0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-schemas:
    name: Validar JSON schemas + sync versión + token_estimate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: JSON válido (run.schema.json, vulnerabilities.schema.json)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('references/schemas/run.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('references/schemas/vulnerabilities.schema.json','utf8'))"
      - name: Versión SKILL.md == loki.manifest.sh == badge README
        run: |
          MANIFEST_VERSION=$(sed -n 's/.*LOKI_VERSION="\([^"]*\)".*/\1/p' loki.manifest.sh)
          SKILL_VERSION=$(sed -n 's/^version:[[:space:]]*//p' SKILL.md | head -1)
          README_VERSION=$(sed -n 's/.*badge\/versi[^-]*-\([0-9.]*\)-black.*/\1/p' README.md | head -1)
          echo "manifest=$MANIFEST_VERSION skill.md=$SKILL_VERSION readme_badge=$README_VERSION"
          test "$MANIFEST_VERSION" = "$SKILL_VERSION"
          test "$MANIFEST_VERSION" = "$README_VERSION"
      - name: token_estimate sin drift >10% (scripts/token-audit.ps1)
        shell: pwsh
        run: ./scripts/token-audit.ps1

  repo-sync:
    name: Sync interno (tools ×2, wrappers, árbol README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Listas T0 idénticas install.ps1 == install.sh (≥10 tools)
        run: |
          set -euo pipefail
          ps_tools=$(grep -o '\$tools = @([^)]*)' install.ps1 | head -1 | sed 's/.*@("//; s/")$//' | tr ',' '\n' | tr -d ' "' | sort)
          sh_tools=$(grep -o 'TOOLS="[^"]*"' install.sh | head -1 | sed 's/^TOOLS="//; s/"$//' | tr ' ' '\n' | sort)
          ps_count=$(printf '%s\n' "$ps_tools" | grep -c . || true)
          sh_count=$(printf '%s\n' "$sh_tools" | grep -c . || true)
          echo "install.ps1=$ps_count tools | install.sh=$sh_count tools"
          if [ "$ps_count" -lt 10 ] || [ "$sh_count" -lt 10 ]; then
            echo "ERROR: parseo de tools vacío o incompleto (mínimo 10)"
            exit 1
          fi
          diff <(printf '%s\n' "$ps_tools") <(printf '%s\n' "$sh_tools") || { echo "ERROR: listas T0 divergentes entre install.ps1 e install.sh"; exit 1; }
      - name: Wrappers de engine en sync (literal de engine normalizado)
        run: |
          set -euo pipefail
          norm() { sed 's/Claude Code/ENGINE/g; s/OpenCode/ENGINE/g; s/Gemini CLI/ENGINE/g' "$1"; }
          diff <(norm .claude/commands/loki.md) <(norm .opencode/commands/loki.md) || { echo "ERROR: wrappers loki.md divergentes (Claude vs OpenCode)"; exit 1; }
          cmp -s .claude/commands/loki-scan.md .opencode/commands/loki-scan.md || { echo "ERROR: wrappers loki-scan.md divergentes (Claude vs OpenCode)"; exit 1; }
          echo "wrappers OK"
      - name: README lista templates/informe.html
        run: grep -q 'templates/informe.html' README.md

  skill-lint:
    name: skill-lint (dogfooding — Loki pasa su propio preflight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Patrones BLOQUEO + WARN (references/skill-lint.md) — alcance ampliado
        run: |
          set -euo pipefail
          # El catálogo (references/skill-lint.md) se auto-excluye: contiene los literales de los patrones.
          FILES=$(ls SKILL.md references/*.md .claude/commands/*.md .opencode/commands/*.md .gemini/commands/*.toml install.sh install.ps1 loki.manifest.sh | grep -v '^references/skill-lint\.md$')
          [ -n "$FILES" ] || { echo "ERROR: alcance de lint vacio"; exit 1; }
          FAIL=0
          check() {
            if grep -REiq "$1" $FILES; then
              echo "BLOQUEO: $2"
              grep -REin "$1" $FILES | head -5
              FAIL=1
            fi
          }
          warn() {
            if grep -REiq "$1" $FILES; then
              echo "::warning::WARN: $2"
              grep -REin "$1" $FILES | head -3
            fi
          }
          check 'curl[^|]*\|[[:space:]]*(ba)?sh' '1 pipe a shell (curl)'
          check 'wget[^|]*\|[[:space:]]*(ba)?sh' '2 pipe a shell (wget)'
          check 'eval[^\n]*base64|FromBase64String|IEX[[:space:]]*\(' '3 eval/base64'
          check 'rm[[:space:]]+-r[f]?[[:space:]]+(/~|\$HOME|/etc)' '4 rm destructivo'
          check 'allowed-tools:.*Bash\((\*|rm|sudo|sh)([[:space:]]|\)|$)' '5a allowed-tools inline'
          check '^[[:space:]]*-[[:space:]]+Bash\((\*|rm|sudo|sh)([[:space:]]|\)|$)' '5b allowed-tools en lista'
          check 'curl[^\n]*(-d|--data)[^\n]*(\.env|id_rsa|\.aws|api[_-]?key|token)' '6 exfil POST'
          check 'bash[[:space:]]+-i.*>&.*dev/tcp|nc[^\n]*[[:space:]]-e[[:space:]]' '7 reverse shell'
          check 'NOPASSWD' '8 sudoers'
          check '\.ssh/authorized_keys' '9 authorized_keys'
          check 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}' '10 secretos'
          check 'ignore[[:space:]]+(previous|prior|above)[[:space:]]+instructions' '11 injection (en)'
          check 'olvida[[:space:]]+(las|los)[[:space:]]+instrucciones' '11 injection (es)'
          warn 'git[[:space:]]+push[^\n]*[[:space:]](--force|-f)' '12 git push --force'
          warn 'chmod[[:space:]]+777|NODE_TLS_REJECT_UNAUTHORIZED=0|InsecureSkipVerify' '13 permiso/insecure'
          warn 'sudo[[:space:]]+' '14 sudo fuera de seccion de instalacion'
          if find references -maxdepth 2 \( -name '*.sh' -o -name '*.ps1' -o -name '*.py' \) -print -quit | grep -q .; then
            echo "::warning::WARN: 15 script adjunto en references/"
            find references -maxdepth 2 \( -name '*.sh' -o -name '*.ps1' -o -name '*.py' \) -print
          fi
          exit $FAIL

  install-check-windows:
    name: install.ps1 -Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar y verificar SYNC
        shell: pwsh
        run: |
          .\install.ps1
          .\install.ps1 -Check

  install-check-unix:
    name: install.sh --check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar y verificar SYNC
        run: |
          chmod +x install.sh
          ./install.sh
          ./install.sh --check

  installer-sanity:
    name: Instaladores — sintaxis + rutas del manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: bash -n install.sh
        run: bash -n install.sh
      - name: PowerShell parse sin errores (install.ps1 + scripts/*.ps1)
        shell: pwsh
        run: |
          $files = @("install.ps1") + (Get-ChildItem scripts/*.ps1 | ForEach-Object FullName)
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "Errores de parse en $f"
            }
            Write-Host "parse OK: $f"
          }
      - name: LOKI_FILES / LOKI_CMD_LIST existen en el repo
        run: |
          set -euo pipefail
          . ./loki.manifest.sh
          missing=0
          for f in $LOKI_FILES; do
            if [ ! -e "$f" ]; then echo "FALTA LOKI_FILES: $f"; missing=1; fi
          done
          for c in $LOKI_CMD_LIST; do
            for d in .claude/commands .opencode/commands; do
              if [ ! -f "$d/$c.md" ]; then echo "FALTA: $d/$c.md"; missing=1; fi
            done
            if [ ! -f ".gemini/commands/$c.toml" ]; then echo "FALTA: .gemini/commands/$c.toml"; missing=1; fi
          done
          if [ "$missing" != "0" ]; then echo "ERROR: el manifest declara rutas inexistentes"; exit 1; fi
          echo "manifest OK"

  scripts-smoke:
    name: Smoke tests de scripts/*.ps1 (fixtures en tests/)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Copiar fixtures a RUNNER_TEMP (no ensuciar el repo)
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "loki-smoke"
          Copy-Item -Recurse -Force tests/fixtures $dst
          "FIXTURES=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: metrics.ps1 (findings/USD + %T0)
        shell: pwsh
        run: |
          $out = (& .\scripts\metrics.ps1 -RunDir (Join-Path $env:FIXTURES "run")) -join "`n"
          Write-Host $out
          if ($out -notmatch 'findings/USD\s+:\s+6') { throw 'metrics: findings/USD esperado 6 (3 findings / $0.5)' }
          if ($out -notmatch '66\.7%') { throw 'metrics: %T0 esperado 66.7' }
      - name: score.ps1 (precision/recall/F1 vs groundtruth)
        shell: pwsh
        run: |
          $json = (& .\scripts\score.ps1 -Findings (Join-Path $env:FIXTURES "run\vulnerabilities.json") -GroundTruth references\groundtruth\juice-shop.json) -join "`n"
          Write-Host $json
          $r = $json | ConvertFrom-Json
          if ($r.tp -ne 2) { throw "score: tp esperado 2, obtenido $($r.tp)" }
          if ($r.fp -ne 1) { throw "score: fp esperado 1, obtenido $($r.fp)" }
          if ($r.f1 -le 0) { throw "score: f1 debe ser > 0" }
      - name: delta.ps1 (new/fixed/unchanged)
        shell: pwsh
        run: |
          $json = (& .\scripts\delta.ps1 -Prev (Join-Path $env:FIXTURES "run\vulnerabilities-prev.json") -Curr (Join-Path $env:FIXTURES "run\vulnerabilities.json")) -join "`n"
          Write-Host $json
          $r = $json | ConvertFrom-Json
          if ($r.new.Count -ne 2) { throw "delta: new esperado 2, obtenido $($r.new.Count)" }
          if ($r.fixed.Count -ne 1) { throw "delta: fixed esperado 1, obtenido $($r.fixed.Count)" }
          if ($r.unchanged -ne 1) { throw "delta: unchanged esperado 1, obtenido $($r.unchanged)" }
      - name: digest-sarif.ps1 (SARIF -> digest)
        shell: pwsh
        run: |
          $json = (& .\scripts\digest-sarif.ps1 -Sarif (Join-Path $env:FIXTURES "sample.sarif")) -join "`n"
          Write-Host $json
          $r = $json | ConvertFrom-Json
          if (@($r)[0].rule -ne 'FIX001') { throw "digest: rule esperada FIX001, obtenida $(@($r)[0].rule)" }
